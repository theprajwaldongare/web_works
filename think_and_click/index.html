<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think And Click</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://img.icons8.com/?size=96&id=m8PngYPyNV2z&format=png" type="image/x-icon" />
</head>

<body>
    <div class="hed">
        <div class="heading">
            Think And Click
        </div>
    </div>
    <div class="com" id="com">
        <div class="play" id="play"><div class="ply" id="ply">PLAY</div></div>
        
    </div>
    <div class="playagain" id="playagain"><div class="plyagn" id="plyagn">PLAY AGAIN</div></div>
    <div class="time"><div class="timer" id="timer"></div></div>
    <div class="container">
        <div class="main" id="main">
            <div class="r1">
                <div class="crl" id="c11"></div>
                <div class="crl" id="c12"></div>
                <div class="crl" id="c13"></div>
            </div>
            <div class="r2">
                <div class="crl" id="c21"></div>
                <div class="crl" id="c22"></div>
                <div class="crl" id="c23"></div>
            </div>
            <div class="r3">
                <div class="crl" id="c31"></div>
                <div class="crl" id="c32"></div>
                <div class="crl" id="c33"></div>
            </div>
        </div>
    </div>
    <div class="hint"><div class="hnt">In given time, click on the tiles in the order of text color ! <div class="ex">Example : <span class="exm">Yellow </span> - click on red not on yellow ! </div></div>
    
</div>

<!-- In given time, click on the tiles in the order of color of the text displayed ! -->
    <script src="main.js"></script>
</body>

  </html>
